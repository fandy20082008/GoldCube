name: Docs Docker image
run-name: 文档站多架构镜像 · ${{ inputs.release_tag }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact goldcube-vX.Y.Z-custom.N tag (must equal selected workflow commit)
        required: true
        type: string
      acceptance_record:
        description: External schemaVersion 1 reviewed source-delivery JSON (no secrets)
        required: true
        type: string

concurrency:
  group: goldcube-docs-${{ inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ vars.GOLDCUBE_DOCS_IMAGE }}

jobs:
  release-gate:
    name: Exact candidate and reviewed source delivery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Require exact tag, owned image, source review and baseline
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          WORKFLOW_COMMIT: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          GOLDCUBE_RELEASE_RECORD: ${{ inputs.acceptance_record }}
          GOLDCUBE_SOURCE_MODE: ${{ vars.GOLDCUBE_SOURCE_MODE }}
          GOLDCUBE_SNAPSHOT_PROOF: ${{ vars.GOLDCUBE_SNAPSHOT_PROOF }}
          GOLDCUBE_SNAPSHOT_PROOF_SHA256: ${{ vars.GOLDCUBE_SNAPSHOT_PROOF_SHA256 }}
        run: >-
          node scripts/check-goldcube-release.mjs
          --tag "$RELEASE_TAG" --commit "$WORKFLOW_COMMIT"
          --repository "$RELEASE_REPOSITORY" --image "$IMAGE_NAME"
          --component docs

  source-provenance:
    needs: release-gate
    uses: ./.github/workflows/source-provenance.yml

  quality:
    needs: release-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level moderate
      - run: pnpm run types:check
      - run: pnpm run build

  security:
    needs: release-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Scan committed secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Initialize CodeQL
        uses: github/codeql-action/init@47be0dbd5113ab1b79fe2dd3f68bdf7e426cdc87 # v3
        with:
          languages: javascript-typescript
      - name: Analyze JavaScript and TypeScript
        uses: github/codeql-action/analyze@47be0dbd5113ab1b79fe2dd3f68bdf7e426cdc87 # v3

  meta:
    needs: release-gate
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.release_tag }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

  build:
    needs:
      - release-gate
      - source-provenance
      - quality
      - security
      - meta
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./docs/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ needs.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docs-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docs-${{ matrix.arch }}

      - name: Export digest
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs:
      - meta
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: docs-digests-*
          merge-multiple: true

      - name: Create multi-arch manifest
        id: manifest
        shell: bash
        env:
          TAGS: ${{ needs.meta.outputs.tags }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              tag_args+=("-t" "$tag")
            fi
          done <<< "$TAGS"

          digest_args=()
          while IFS= read -r digest_file; do
            digest_args+=("${IMAGE_NAME}@sha256:${digest_file}")
          done < <(find "$RUNNER_TEMP/digests" -type f -printf '%f\n' | sort)

          docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"
          primary_tag="$(printf '%s\n' "$TAGS" | sed '/^$/d' | head -n 1)"
          digest="$(docker buildx imagetools inspect "$primary_tag" | awk '/^Digest:/ && digest == "" { digest = $2 } END { print digest }')"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  attest:
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE_NAME }}@${{ needs.merge.outputs.digest }}
          format: spdx-json
          output-file: vozeb-pro-docs-sbom.spdx.json
          upload-artifact: false
      - name: Upload SPDX SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vozeb-pro-docs-sbom-${{ inputs.release_tag }}
          path: vozeb-pro-docs-sbom.spdx.json
          if-no-files-found: error
      - name: Sign immutable image digest
        run: cosign sign --yes "${IMAGE_NAME}@${{ needs.merge.outputs.digest }}"
      - name: Attach signed SBOM attestation
        run: cosign attest --yes --type spdxjson --predicate vozeb-pro-docs-sbom.spdx.json "${IMAGE_NAME}@${{ needs.merge.outputs.digest }}"
